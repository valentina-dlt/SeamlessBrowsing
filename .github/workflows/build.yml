name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:browser
      - run: cd extension && zip -r ../Cookie-Calm-Chrome.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Cookie-Calm-Chrome
          path: Cookie-Calm-Chrome.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: mkdir -p /tmp/policy-test && javac -d /tmp/policy-test android/app/src/main/java/uk/co/cookiecalm/Policy.java tests/PolicyTest.java && java -cp /tmp/policy-test PolicyTest
      - run: gradle -p android :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cookie-Calm-Samsung-experimental
          path: android/app/build/outputs/apk/debug/app-debug.apk
