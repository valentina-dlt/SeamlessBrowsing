plugins { id 'com.android.application' }

def signingStorePath = System.getenv('ANDROID_SIGNING_KEY_PATH')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '4').toInteger()

android {
    namespace 'uk.co.cookiecalm'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.cookiecalm'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Install beside the older app so popup fixes can be tried without removing it.
            applicationIdSuffix '.popupfix'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
